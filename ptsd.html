<!DOCTYPE html>
<html>
<head>
<title>PTSD Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="test-container">
<h2>PTSD Test</h2>

<form id="ptsdForm">

<p>1. Reliving traumatic events?</p>
<select name="q1"><option value="0">Not at all</option><option value="1">Several days</option><option value="2">More than half the days</option><option value="3">Nearly every day</option></select>

<p>2. Avoid reminders of trauma?</p>
<select name="q2"><option value="0">Not at all</option><option value="1">Several days</option><option value="2">More than half the days</option><option value="3">Nearly every day</option></select>

<p>3. Feeling on edge?</p>
<select name="q3"><option value="0">Not at all</option><option value="1">Several days</option><option value="2">More than half the days</option><option value="3">Nearly every day</option></select>

<p>4. Sleep disturbance?</p>
<select name="q4"><option value="0">Not at all</option><option value="1">Several days</option><option value="2">More than half the days</option><option value="3">Nearly every day</option></select>

<button type="button" onclick="calculateTest('ptsdForm')">Submit</button>
</form>

<h3 id="result"></h3>

<div class="card" onclick="location.href='mental.html'">home back</div>



</div>
<script>
    function calculateTest(formId) {
  const form = document.forms[formId];
  let score = 0;

  for (let i = 1; i <= 4; i++) {
    score += parseInt(form["q" + i].value);
  }

  let result = "";

  if (score <= 4) result = "Low 😊";
  else if (score <= 8) result = "Mild 😐";
  else if (score <= 12) result = "Moderate 😟";
  else result = "Severe ⚠️ Seek help";

  document.getElementById("result").innerText =
    "Score: " + score + " → " + result;
}
</script>

<script src="test.js"></script>

<style>
    /* 🌈 Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: rgb(84, 144, 201);
  background-size: cover;
  background-position: center;
}

/* 🧠 Container */
.test-container {
  width: 420px;
  margin: 60px auto;
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* 🔥 Bold Heading */
.test-container h2 {
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

/* ❓ Questions */
.test-container p {
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 5px;
}

/* 📥 Dropdown */
select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
  transition: 0.3s;
}

select:focus {
  border-color: #0ea5e9;
  box-shadow: 0 0 6px #0ea5e9;
  outline: none;
}

/* 🔘 Button */
button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(45deg, #0ea5e9, #0284c7);
  color: white;
  border: none;
  border-radius: 25px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* 📊 Result */
#result {
  margin-top: 20px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: #0c4a6e;
}

/* ⚠️ Note */
.note {
  color: red;
  text-align: center;
  font-size: 13px;
  margin-top: 10px;
}

/* 🖼️ Banner (Optional Top Image) */
.banner {
  background: rgb(67, 140, 209);
  background-size: cover;
  background-position: center;
  height: 180px;
  border-radius: 20px 20px 0 0;
  margin-bottom: 15px;
}
</style>
</body>
</html>
